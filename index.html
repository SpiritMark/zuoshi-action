<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>做事行动器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Heroicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/heroicons@2.0.18/24/outline/index.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
            position: relative;
        }

        /* 简约几何背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 75% 75%, rgba(99, 102, 241, 0.03) 0%, transparent 25%),
                linear-gradient(45deg, transparent 48%, rgba(59, 130, 246, 0.02) 49%, rgba(59, 130, 246, 0.02) 51%, transparent 52%);
            background-size: 400px 400px, 300px 300px, 60px 60px;
            animation: gentleFloat 30s ease-in-out infinite;
            pointer-events: none;
            z-index: -2;
        }

        /* 添加微妙的网格纹理 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.01) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes gentleFloat {
            0%, 100% { 
                opacity: 1; 
                transform: translateX(0px) translateY(0px) rotate(0deg); 
            }
            33% { 
                opacity: 0.8; 
                transform: translateX(10px) translateY(-5px) rotate(0.5deg); 
            }
            66% { 
                opacity: 0.9; 
                transform: translateX(-5px) translateY(8px) rotate(-0.3deg); 
            }
        }

        .glass-morphism {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.1);
            box-shadow: 
                0 8px 32px rgba(59, 130, 246, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.6) inset,
                0 -1px 0 rgba(59, 130, 246, 0.05) inset;
            position: relative;
            overflow: hidden;
        }

        .glass-morphism::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.08), transparent);
            transition: left 0.8s ease;
        }

        .glass-morphism:hover::before {
            left: 100%;
        }

        .shadow-glow {
            box-shadow: 
                0 10px 40px rgba(59, 130, 246, 0.15),
                0 4px 20px rgba(59, 130, 246, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.4) inset,
                0 -1px 0 rgba(59, 130, 246, 0.1) inset;
        }

        .hover-lift {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .hover-lift:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 
                0 25px 50px rgba(59, 130, 246, 0.2),
                0 10px 30px rgba(59, 130, 246, 0.15),
                0 1px 0 rgba(255, 255, 255, 0.5) inset,
                0 -1px 0 rgba(59, 130, 246, 0.15) inset;
        }

        .hover-lift:active {
            transform: translateY(-2px) scale(0.98);
            transition: all 0.1s ease;
        }

        .pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 
                    0 10px 40px rgba(59, 130, 246, 0.15),
                    0 4px 20px rgba(59, 130, 246, 0.08),
                    0 1px 0 rgba(255, 255, 255, 0.4) inset,
                    0 -1px 0 rgba(59, 130, 246, 0.1) inset;
            }
            50% {
                box-shadow: 
                    0 15px 60px rgba(59, 130, 246, 0.25),
                    0 6px 30px rgba(59, 130, 246, 0.15),
                    0 1px 0 rgba(255, 255, 255, 0.5) inset,
                    0 -1px 0 rgba(59, 130, 246, 0.15) inset;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-in.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 时间显示优化 */
        .time-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.8));
            border: 1px solid rgba(59, 130, 246, 0.08);
            box-shadow: 
                0 4px 20px rgba(59, 130, 246, 0.06),
                0 1px 0 rgba(255, 255, 255, 0.8) inset;
            transition: all 0.3s ease;
        }

        .time-container:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.9));
            transform: translateY(-1px);
            box-shadow: 
                0 6px 25px rgba(59, 130, 246, 0.1),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        /* 按钮样式优化 */
        .main-button {
            position: relative;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 
                0 10px 40px rgba(59, 130, 246, 0.2),
                0 1px 0 rgba(255, 255, 255, 0.3) inset,
                0 -1px 0 rgba(29, 78, 216, 0.3) inset;
        }

        .main-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .main-button:active::after {
            width: 300px;
            height: 300px;
        }

        /* 结果容器优化 - 3D拟态效果 */
        .result-container {
            background: linear-gradient(145deg, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(248, 250, 252, 0.9) 50%, 
                rgba(241, 245, 249, 0.85) 100%);
            border: 1px solid rgba(59, 130, 246, 0.12);
            box-shadow: 
                /* 外阴影 - 3D效果 */
                0 20px 60px rgba(59, 130, 246, 0.15),
                0 8px 30px rgba(59, 130, 246, 0.1),
                0 4px 15px rgba(59, 130, 246, 0.08),
                /* 内阴影 - 凹陷效果 */
                inset 0 2px 4px rgba(255, 255, 255, 0.8),
                inset 0 -2px 4px rgba(59, 130, 246, 0.05),
                /* 顶部高光 */
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            position: relative;
            transform-style: preserve-3d;
        }

        /* 3D卡片悬浮效果 */
        .result-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, 
                rgba(59, 130, 246, 0.1) 0%, 
                rgba(99, 102, 241, 0.05) 50%, 
                rgba(59, 130, 246, 0.1) 100%);
            border-radius: inherit;
            z-index: -1;
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .result-container:hover::before {
            opacity: 1;
        }

        .result-icon {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(248, 250, 252, 0.9) 30%, 
                rgba(241, 245, 249, 0.85) 70%, 
                rgba(226, 232, 240, 0.8) 100%);
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 
                /* 外阴影 - 立体效果 */
                0 12px 35px rgba(59, 130, 246, 0.2),
                0 6px 20px rgba(59, 130, 246, 0.15),
                0 3px 10px rgba(59, 130, 246, 0.1),
                /* 内阴影 - 凹陷效果 */
                inset 0 3px 6px rgba(255, 255, 255, 0.9),
                inset 0 -3px 6px rgba(59, 130, 246, 0.08),
                /* 顶部高光 */
                inset 0 1px 0 rgba(255, 255, 255, 1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: iconFloat 4s ease-in-out infinite;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 图标3D光晕效果 */
        .result-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: conic-gradient(
                from 0deg,
                rgba(59, 130, 246, 0.1) 0deg,
                rgba(99, 102, 241, 0.05) 90deg,
                rgba(147, 51, 234, 0.05) 180deg,
                rgba(59, 130, 246, 0.1) 270deg,
                rgba(59, 130, 246, 0.1) 360deg
            );
            border-radius: inherit;
            z-index: -1;
            filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .result-icon:hover::after {
            opacity: 1;
        }

        @keyframes iconFloat {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(1);
                box-shadow: 
                    0 12px 35px rgba(59, 130, 246, 0.2),
                    0 6px 20px rgba(59, 130, 246, 0.15),
                    0 3px 10px rgba(59, 130, 246, 0.1),
                    inset 0 3px 6px rgba(255, 255, 255, 0.9),
                    inset 0 -3px 6px rgba(59, 130, 246, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 1);
            }
            50% { 
                transform: translateY(-4px) rotate(3deg) scale(1.02);
                box-shadow: 
                    0 18px 45px rgba(59, 130, 246, 0.25),
                    0 8px 25px rgba(59, 130, 246, 0.2),
                    0 4px 15px rgba(59, 130, 246, 0.15),
                    inset 0 4px 8px rgba(255, 255, 255, 0.95),
                    inset 0 -4px 8px rgba(59, 130, 246, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 1);
            }
        }

        .result-icon:hover {
            transform: scale(1.08) rotate(8deg) translateY(-2px);
            box-shadow: 
                0 25px 60px rgba(59, 130, 246, 0.3),
                0 12px 35px rgba(59, 130, 246, 0.25),
                0 6px 20px rgba(59, 130, 246, 0.2),
                inset 0 4px 8px rgba(255, 255, 255, 0.95),
                inset 0 -4px 8px rgba(59, 130, 246, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .result-text-bg {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.98) 0%, 
                rgba(248, 250, 252, 0.95) 30%, 
                rgba(241, 245, 249, 0.92) 70%, 
                rgba(226, 232, 240, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.08);
            box-shadow: 
                /* 外阴影 - 深度效果 */
                0 8px 30px rgba(59, 130, 246, 0.08),
                0 4px 15px rgba(59, 130, 246, 0.06),
                0 2px 8px rgba(59, 130, 246, 0.04),
                /* 内阴影 - 凹陷效果 */
                inset 0 2px 4px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(59, 130, 246, 0.03),
                /* 顶部高光 */
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform-style: preserve-3d;
        }

        /* 文本区域光效 */
        .result-text-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(59, 130, 246, 0.2) 50%, 
                transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .result-text-bg:hover {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 1) 0%, 
                rgba(248, 250, 252, 0.98) 30%, 
                rgba(241, 245, 249, 0.95) 70%, 
                rgba(226, 232, 240, 0.92) 100%);
            box-shadow: 
                0 12px 40px rgba(59, 130, 246, 0.12),
                0 6px 20px rgba(59, 130, 246, 0.08),
                0 3px 12px rgba(59, 130, 246, 0.06),
                inset 0 3px 6px rgba(255, 255, 255, 0.95),
                inset 0 -3px 6px rgba(59, 130, 246, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            transform: translateY(-1px);
        }

        .result-text-bg:hover::before {
            opacity: 1;
        }

        /* iOS Safari 兼容性优化 */
        @supports (-webkit-touch-callout: none) {
            .main-container {
                /* iOS 防止页面被选中的样式 */
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }

            /* iOS Safari 输入框优化 */
            input, textarea, button {
                -webkit-appearance: none;
                -webkit-tap-highlight-color: rgba(0,0,0,0);
            }
        }

        /* 移动端触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .hover-lift:hover {
                transform: none; /* 移除触摸设备的hover效果 */
            }

            .main-button {
                min-height: 48px; /* 确保按钮有足够大的触摸区域 */
                padding: 16px 24px;
            }
        }

        /* 响应式优化 - 超小屏幕 */
        @media (max-width: 360px) {
            .main-container {
                padding: 0.75rem;
            }

            .main-title {
                font-size: 2rem;
                line-height: 1.2;
            }

            .time-display {
                font-size: 0.875rem;
            }

            .main-button {
                padding: 12px 20px;
                font-size: 1rem;
                min-height: 44px;
            }

            .glass-morphism {
                padding: 12px;
            }

            .result-text-bg {
                padding: 16px;
                font-size: 0.9rem;
            }
        }

        /* 响应式优化 - 小屏幕 */
        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }

            .main-title {
                font-size: 2.5rem;
            }

            .time-display {
                font-size: 1rem;
            }

            .main-button {
                min-height: 48px;
                padding: 14px 24px;
            }

            /* 优化按钮布局 */
            .flex.gap-3 {
                gap: 12px;
            }

            .flex.gap-3 button {
                flex: 1;
                min-width: 0;
                font-size: 0.9rem;
            }
        }

        /* 响应式优化 - 中等屏幕 */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .main-container {
                max-width: none;
            }

            /* 优化历史记录和统计区域 */
            .max-h-32 {
                max-height: 200px;
            }

            .grid-cols-2 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* iOS 安全区域适配 */
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-bottom: env(safe-area-inset-bottom);
            }

            .main-container {
                margin-top: env(safe-area-inset-top);
            }
        }

        /* 防止iOS Safari的bounce滚动 */
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        .main-container {
            position: relative;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 32px;
        }

        /* 桌面端恢复正常滚动 */
        @media (min-width: 769px) {
            body {
                position: static;
                overflow: auto;
            }

            .main-container {
                height: auto;
                overflow-y: visible;
                -webkit-overflow-scrolling: auto;
            }
        }

        /* 滚动条优化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #007BFF, #0056b3);
            border-radius: 3px;
        }

        /* 选择文本样式 */
        ::selection {
            background: rgba(0, 123, 255, 0.2);
            color: #333;
        }

        /* Toast 提示样式 */
        .toast-enter {
            opacity: 0;
            transform: translateX(100%);
        }

        .toast-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: all 0.3s ease;
        }

        /* 分享对话框样式 */
        .share-dialog-overlay {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 彩蛋动画 - 3D效果 */
        .easter-egg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) perspective(1000px) rotateX(15deg);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: rainbow 3s ease infinite, easterFloat 2s ease-in-out infinite;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes easterFloat {
            0%, 100% { 
                transform: translateX(-50%) perspective(1000px) rotateX(15deg) translateY(0px);
            }
            50% { 
                transform: translateX(-50%) perspective(1000px) rotateX(15deg) translateY(-5px);
            }
        }

        /* 加载动画 */
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="main-container w-full max-w-md">
        <!-- 时间显示区域 -->
        <div class="text-right mb-4">
            <div class="time-container glass-morphism rounded-lg px-4 py-2 inline-block">
                <p class="text-gray-700 text-sm font-medium">
                    <i class="fas fa-clock mr-2" style="color: #007BFF; font-size: 0.9rem;"></i>
                    <span>北京时间</span>
                </p>
                <p id="beijingTime" class="time-display text-blue-600 font-mono text-lg font-semibold">
                    --:--:--
                </p>
            </div>
        </div>

        <!-- 标题区域 -->
        <div class="text-center mb-12">
            <h1 class="main-title text-4xl font-light text-gray-800 mb-2 tracking-wide cursor-pointer select-none" onclick="checkEasterEgg()" id="titleText">做事行动器</h1>
            <p class="text-gray-600 text-sm">让命运决定你的选择</p>
        </div>

        <!-- 主要按钮 -->
        <div class="mb-8">
            <button
                id="decisionButton"
                class="main-button w-full glass-morphism shadow-glow hover-lift pulse-glow py-6 px-8 rounded-2xl border-0 text-white font-medium text-lg cursor-pointer select-none"
                onclick="makeDecision()"
            >
                <span class="flex items-center justify-center relative z-10">
                    <i class="fas fa-dice mr-3" style="color: white; font-size: 1.2rem;"></i>
                    告诉我该怎么做
                </span>
            </button>
        </div>

        <!-- 结果显示区域 -->
        <div id="resultContainer" class="fade-in">
            <div class="result-container glass-morphism rounded-2xl p-8 text-center">
                <div class="mb-4">
                    <div class="result-icon w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-2xl">
                        <span id="resultIcon">✨</span>
                    </div>
                    <h2 class="text-2xl font-light text-gray-800 mb-2">命运的指引</h2>
                    <div id="categoryBadge" class="inline-block px-3 py-1 rounded-full text-xs font-medium mb-2" style="background: rgba(0, 123, 255, 0.1); color: #007BFF; display: none;">
                        <span id="categoryText"></span>
                    </div>
                </div>
                <div class="result-text-bg rounded-xl p-6">
                    <p id="resultText" class="text-xl font-medium text-gray-700 leading-relaxed">
                        点击按钮，聆听命运的安排
                    </p>
                </div>
                <div class="mt-6 flex gap-3 justify-center flex-wrap">
                    <button
                        id="retryButton"
                        class="glass-morphism shadow-glow hover-lift px-6 py-3 rounded-xl text-blue-600 font-medium cursor-pointer border-0"
                        style="background: rgba(255, 255, 255, 0.3);"
                        onclick="retry()"
                    >
                        重新决定
                    </button>
                    <button
                        id="shareButton"
                        class="glass-morphism shadow-glow hover-lift px-6 py-3 rounded-xl text-green-600 font-medium cursor-pointer border-0"
                        style="background: rgba(255, 255, 255, 0.3); display: none;"
                        onclick="shareResult()"
                    >
                        <i class="fas fa-share-alt mr-1" style="font-size: 0.9rem;"></i>
                        分享结果
                    </button>
                </div>

                <!-- 历史记录区域 -->

                category: decision.category,
                timestamp: timestamp

            decisionHistory.unshift(record);
            if (decisionHistory.length > 50) {
                decisionHistory = decisionHistory.slice(0, 50);
            }

            // 更新统计
            decisionStats[decision.category] = (decisionStats[decision.category] || 0) + 1;

            // 保存到本地存储
            localStorage.setItem('decisionHistory', JSON.stringify(decisionHistory));
            localStorage.setItem('decisionStats', JSON.stringify(decisionStats));

        function playSound(type) {
            // 检测是否为iOS设备
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);
            const supportsVibration = 'vibrate' in navigator;

            // 触觉反馈
            function provideHapticFeedback() {
                if (supportsVibration && (isIOS || isAndroid)) {
                    try {
                        if (isIOS) {
                            // iOS轻微振动（如果支持）
                            navigator.vibrate(50);
                        } else if (isAndroid) {
                            // Android振动反馈
                            navigator.vibrate(30);
                        }
                    } catch (e) {
                        // 静默处理振动失败
                    }
                }
            }

            // 简化的音效实现（在现代浏览器中可能受限）
            try {
                // iOS Safari需要用户手势才能启用音频上下文
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const audioContext = new AudioContext();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    switch(type) {
                        case 'click':
                            provideHapticFeedback();
                            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                            oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                            gainNode.gain.setValueAtTime(isIOS ? 0.05 : 0.1, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.1);
                            break;
                        case 'share':
                            oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                            gainNode.gain.setValueAtTime(isIOS ? 0.03 : 0.05, audioContext.currentTime);
                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.2);
                            break;
                        case 'clear':
                            provideHapticFeedback();
                            oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                            gainNode.gain.setValueAtTime(isIOS ? 0.05 : 0.1, audioContext.currentTime);
                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.3);
                            break;
                        case 'easter':
                            provideHapticFeedback();
                            oscillator.frequency.setValueAtTime(523, audioContext.currentTime); // C5
                            oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1); // E5
                            oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2); // G5
                            gainNode.gain.setValueAtTime(isIOS ? 0.04 : 0.08, audioContext.currentTime);
                            gainNode.gain.setValueAtTime(0.02, audioContext.currentTime + 0.3);
                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.3);
                            break;
                    }
                }
            } catch (e) {
                // 静默处理音效失败
                // 在不支持音频上下文的环境中，只提供触觉反馈
                if (type === 'click' || type === 'clear' || type === 'easter') {
                    provideHapticFeedback();
                }
            }
        }

        // 北京时间显示功能
        function updateBeijingTime() {
            const now = new Date();
            // 获取北京时间 (UTC+8)
            const beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));

            const hours = beijingTime.getHours().toString().padStart(2, '0');
            const minutes = beijingTime.getMinutes().toString().padStart(2, '0');
            const seconds = beijingTime.getSeconds().toString().padStart(2, '0');

            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById('beijingTime').textContent = timeString;
        }

        // 初始化时间显示并每秒更新
        updateBeijingTime();
        setInterval(updateBeijingTime, 1000);

        document.getElementById('resultContainer').classList.remove('show');
        document.getElementById('shareButton').style.display = 'none';
        document.getElementById('categoryBadge').style.display = 'none';

        // 彩蛋功能
        function checkEasterEgg() {
            easterEggClicks++;

            if (easterEggClicks === 1) {
                easterEggTimer = setTimeout(() => {
                    easterEggClicks = 0;
                }, 2000);
            } else if (easterEggClicks >= 7) {
                triggerEasterEgg();
                easterEggClicks = 0;
                if (easterEggTimer) {
                    clearTimeout(easterEggTimer);
                }
            }
        }

        function triggerEasterEgg() {
            const titleText = document.getElementById('titleText');
            const originalText = titleText.textContent;

            // 显示彩蛋消息
            const easterEgg = document.createElement('div');
            easterEgg.className = 'easter-egg';
            easterEgg.textContent = '🎉 你发现了一个彩蛋！🎉';
            document.body.appendChild(easterEgg);

            // 播放音效
            playSound('easter');

            // 标题变色动画
            titleText.style.background = 'linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57)';
            titleText.style.backgroundSize = '400% 400%';
            titleText.style.animation = 'rainbow 2s ease infinite';
            titleText.style.webkitBackgroundClip = 'text';
            titleText.style.backgroundClip = 'text';
            titleText.style.webkitTextFillColor = 'transparent';

            // 3秒后恢复原状
            setTimeout(() => {
                document.body.removeChild(easterEgg);
                titleText.style.background = '';
                titleText.style.backgroundSize = '';
                titleText.style.animation = '';
                titleText.style.webkitBackgroundClip = '';
                titleText.style.backgroundClip = '';
                titleText.style.webkitTextFillColor = '';
            }, 3000);

            showToast('🌈 彩蛋已激活！');
        }

        function initMobileOptimizations() {
            // 检测是否为移动设备
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

            if (isMobile) {
                // 防止双击缩放
                let lastTouchEnd = 0;
                document.addEventListener('touchend', function(event) {
                    const now = (new Date()).getTime();
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault();
                    }
                    lastTouchEnd = now;
                }, false);

                // 防止长按选择文本（iOS Safari）
                document.addEventListener('contextmenu', function(e) {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                    }
                });

                // 优化触摸反馈
                document.addEventListener('touchstart', function() {}, { passive: true });
            }

            // iOS Safari 特殊处理
            if (isIOS) {
                // 处理iOS Safari的orientationchange
                window.addEventListener('orientationchange', function() {
                    // 给页面一点时间来调整布局
                    setTimeout(function() {
                        window.scrollTo(0, 0);
                    }, 100);
                });

                // 处理iOS Safari的页面显示/隐藏
                document.addEventListener('pageshow', function(event) {
                    if (event.persisted) {
                        // 页面从缓存中恢复，重新初始化
                        updateHistoryDisplay();
                        updateStatsDisplay();
                    }
                });
            }
        }

        // 页面加载完成后更新历史和统计显示，并初始化移动端优化
        window.addEventListener('load', () => {
            updateHistoryDisplay();
            updateStatsDisplay();
            initMobileOptimizations();
        });
    </script>
</body>
</html>
