<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做事行动器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        /* 背景动画 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.15) 0%, transparent 50%);
            animation: backgroundFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes backgroundFloat {
            0%, 100% { opacity: 1; transform: translateY(0px) rotate(0deg); }
            50% { opacity: 0.8; transform: translateY(-10px) rotate(1deg); }
        }

        .glass-morphism {
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .glass-morphism::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.8s;
        }

        .glass-morphism:hover::before {
            left: 100%;
        }

        .shadow-glow {
            box-shadow: 
                0 8px 32px rgba(0, 123, 255, 0.2),
                0 2px 16px rgba(0, 123, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .hover-lift {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .hover-lift:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 
                0 20px 60px rgba(0, 123, 255, 0.3),
                0 8px 32px rgba(0, 123, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .hover-lift:active {
            transform: translateY(-2px) scale(0.98);
            transition: all 0.1s ease;
        }

        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 
                    0 8px 32px rgba(0, 123, 255, 0.2),
                    0 2px 16px rgba(0, 123, 255, 0.1);
            }
            50% {
                box-shadow: 
                    0 12px 48px rgba(0, 123, 255, 0.4),
                    0 4px 24px rgba(0, 123, 255, 0.2);
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-in.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 时间显示优化 */
        .time-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .time-container:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
            transform: translateY(-2px);
        }

        /* 按钮样式优化 */
        .main-button {
            position: relative;
            background: linear-gradient(135deg, #007BFF 0%, #0056b3 50%, #004085 100%);
            border: none;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .main-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .main-button:active::after {
            width: 300px;
            height: 300px;
        }

        /* 结果容器优化 */
        .result-container {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-icon {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            transition: all 0.3s ease;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        .result-icon:hover {
            transform: scale(1.1) rotate(10deg);
        }

        .result-text-bg {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.5));
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .result-text-bg:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.6));
        }

        /* 响应式优化 */
        @media (max-width: 480px) {
            .main-container {
                padding: 1rem;
            }
            
            .main-title {
                font-size: 2.5rem;
            }
            
            .time-display {
                font-size: 1rem;
            }
        }

        /* 滚动条优化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #007BFF, #0056b3);
            border-radius: 3px;
        }

        /* 选择文本样式 */
        ::selection {
            background: rgba(0, 123, 255, 0.2);
            color: #333;
        }

        /* Toast 提示样式 */
        .toast-enter {
            opacity: 0;
            transform: translateX(100%);
        }

        .toast-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: all 0.3s ease;
        }

        /* 分享对话框样式 */
        .share-dialog-overlay {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 彩蛋动画 */
        .easter-egg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: rainbow 3s ease infinite;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 加载动画 */
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center p-8">
    <div class="main-container w-full max-w-md">
        <!-- 时间显示区域 -->
        <div class="text-right mb-4">
            <div class="time-container glass-morphism rounded-lg px-4 py-2 inline-block">
                <p class="text-gray-700 text-sm font-medium">
                    <span class="mr-2">🕐</span>
                    <span>北京时间</span>
                </p>
                <p id="beijingTime" class="time-display text-blue-600 font-mono text-lg font-semibold">
                    --:--:--
                </p>
            </div>
        </div>

        <!-- 标题区域 -->
        <div class="text-center mb-12">
            <h1 class="main-title text-4xl font-light text-gray-800 mb-2 tracking-wide cursor-pointer select-none" onclick="checkEasterEgg()" id="titleText">做事行动器</h1>
            <p class="text-gray-600 text-sm">让命运决定你的选择</p>
        </div>

        <!-- 主要按钮 -->
        <div class="mb-8">
            <button
                id="decisionButton"
                class="main-button w-full glass-morphism shadow-glow hover-lift pulse-glow py-6 px-8 rounded-2xl border-0 text-white font-medium text-lg cursor-pointer select-none"
                onclick="makeDecision()"
            >
                <span class="flex items-center justify-center relative z-10">
                    <span class="mr-3">🎲</span>
                    告诉我该怎么做
                </span>
            </button>
        </div>

        <!-- 结果显示区域 -->
        <div id="resultContainer" class="fade-in">
            <div class="result-container glass-morphism rounded-2xl p-8 text-center">
                <div class="mb-4">
                    <div class="result-icon w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-2xl">
                        <span id="resultIcon">✨</span>
                    </div>
                    <h2 class="text-2xl font-light text-gray-800 mb-2">命运的指引</h2>
                    <div id="categoryBadge" class="inline-block px-3 py-1 rounded-full text-xs font-medium mb-2" style="background: rgba(0, 123, 255, 0.1); color: #007BFF; display: none;">
                        <span id="categoryText"></span>
                    </div>
                </div>
                <div class="result-text-bg rounded-xl p-6">
                    <p id="resultText" class="text-xl font-medium text-gray-700 leading-relaxed">
                        点击按钮，聆听命运的安排
                    </p>
                </div>
                <div class="mt-6 flex gap-3 justify-center flex-wrap">
                    <button
                        id="retryButton"
                        class="glass-morphism shadow-glow hover-lift px-6 py-3 rounded-xl text-blue-600 font-medium cursor-pointer border-0"
                        style="background: rgba(255, 255, 255, 0.3);"
                        onclick="retry()"
                    >
                        重新决定
                    </button>
                    <button
                        id="shareButton"
                        class="glass-morphism shadow-glow hover-lift px-6 py-3 rounded-xl text-green-600 font-medium cursor-pointer border-0"
                        style="background: rgba(255, 255, 255, 0.3); display: none;"
                        onclick="shareResult()"
                    >
                        📱 分享结果
                    </button>
                </div>

                <!-- 历史记录区域 -->
                <div id="historySection" class="mt-6 text-left" style="display: none;">
                    <div class="glass-morphism rounded-xl p-4">
                        <h3 class="text-lg font-medium text-gray-800 mb-3 flex items-center">
                            <span class="mr-2">📜</span>
                            决策历史
                            <span id="historyCount" class="ml-auto text-sm text-gray-600"></span>
                        </h3>
                        <div id="historyList" class="space-y-2 max-h-32 overflow-y-auto">
                            <!-- 历史记录将在这里显示 -->
                        </div>
                        <button
                            id="clearHistoryButton"
                            class="mt-3 text-xs text-gray-500 hover:text-red-500 transition-colors cursor-pointer"
                            onclick="clearHistory()"
                        >
                            🗑️ 清空历史
                        </button>
                    </div>
                </div>

                <!-- 统计区域 -->
                <div id="statsSection" class="mt-4 text-left" style="display: none;">
                    <div class="glass-morphism rounded-xl p-4">
                        <h3 class="text-lg font-medium text-gray-800 mb-3 flex items-center">
                            <span class="mr-2">📊</span>
                            决策统计
                        </h3>
                        <div id="statsContent" class="grid grid-cols-2 gap-4 text-sm">
                            <!-- 统计内容将在这里显示 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化数据
        let decisionHistory = JSON.parse(localStorage.getItem('decisionHistory')) || [];
        let decisionStats = JSON.parse(localStorage.getItem('decisionStats')) || {};
        let easterEggClicks = 0;
        let easterEggTimer = null;

        const decisions = [
            {
                text: "去做！现在就是行动的最佳时机，机会稍纵即逝。",
                icon: "🚀",
                category: "行动派"
            },
            {
                text: "去做！你的直觉是正确的，跟随内心的指引。",
                icon: "💫",
                category: "直觉型"
            },
            {
                text: "不做。有时候说不也是一种智慧的选择。",
                icon: "🧠",
                category: "智慧型"
            },
            {
                text: "去做！生命在于折腾，不试试怎么知道行不行？",
                icon: "⚡",
                category: "冒险家"
            },
            {
                text: "去做！别让明天的自己后悔今天的犹豫。",
                icon: "🌟",
                category: "励志型"
            },
            {
                text: "不做。欲速则不达，慢慢来比较快。",
                icon: "🐌",
                category: "耐心型"
            },
            {
                text: "去做！世界那么大，我想去看看。",
                icon: "🌍",
                category: "探索者"
            },
            {
                text: "去做！机会只留给有准备的人。",
                icon: "🎯",
                category: "准备型"
            },
            {
                text: "不做。休息是为了走更远的路。",
                icon: "😴",
                category: "休息型"
            },
            {
                text: "去做！人生苦短，及时行乐。",
                icon: "🎉",
                category: "享乐型"
            },
            {
                text: "去做！挑战不可能，创造新可能。",
                icon: "💪",
                category: "挑战者"
            },
            {
                text: "不做。有时候，退一步海阔天空。",
                icon: "🌊",
                category: "哲思型"
            }
        ];

        function makeDecision() {
            const randomIndex = Math.floor(Math.random() * decisions.length);
            const decision = decisions[randomIndex];

            const resultText = document.getElementById('resultText');
            const resultIcon = document.getElementById('resultIcon');
            const categoryBadge = document.getElementById('categoryBadge');
            const categoryText = document.getElementById('categoryText');
            const resultContainer = document.getElementById('resultContainer');
            const shareButton = document.getElementById('shareButton');

            resultText.textContent = decision.text;
            resultIcon.textContent = decision.icon;
            categoryText.textContent = decision.category;
            categoryBadge.style.display = 'inline-block';
            resultContainer.classList.add('show');
            shareButton.style.display = 'inline-block';

            // 按钮动画效果
            const button = document.getElementById('decisionButton');
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 150);

            // 播放音效
            playSound('click');

            // 记录历史和统计
            recordDecision(decision);
        }

        function retry() {
            const resultContainer = document.getElementById('resultContainer');
            const shareButton = document.getElementById('shareButton');
            const categoryBadge = document.getElementById('categoryBadge');

            resultContainer.classList.remove('show');
            shareButton.style.display = 'none';
            categoryBadge.style.display = 'none';

            // 播放音效
            playSound('click');

            setTimeout(() => {
                const resultText = document.getElementById('resultText');
                const resultIcon = document.getElementById('resultIcon');
                resultText.textContent = "点击按钮，聆听命运的安排";
                resultIcon.textContent = "✨";
            }, 300);
        }

        function recordDecision(decision) {
            const timestamp = new Date().toLocaleString('zh-CN');
            const record = {
                text: decision.text,
                icon: decision.icon,
                category: decision.category,
                timestamp: timestamp
            };

            decisionHistory.unshift(record);
            if (decisionHistory.length > 50) {
                decisionHistory = decisionHistory.slice(0, 50);
            }

            // 更新统计
            decisionStats[decision.category] = (decisionStats[decision.category] || 0) + 1;

            // 保存到本地存储
            localStorage.setItem('decisionHistory', JSON.stringify(decisionHistory));
            localStorage.setItem('decisionStats', JSON.stringify(decisionStats));

            // 更新显示
            updateHistoryDisplay();
            updateStatsDisplay();
        }

        function updateHistoryDisplay() {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');

            if (decisionHistory.length > 0) {
                historySection.style.display = 'block';
                historyCount.textContent = `(${decisionHistory.length})`;
                historyList.innerHTML = decisionHistory.slice(0, 5).map(record =>
                    `<div class="text-sm text-gray-600 flex items-center">
                        <span class="mr-2">${record.icon}</span>
                        <span class="flex-1 truncate">${record.text}</span>
                        <span class="text-xs text-gray-400 ml-2">${record.timestamp.split(' ')[1]}</span>
                    </div>`
                ).join('');
            }
        }

        function updateStatsDisplay() {
            const statsSection = document.getElementById('statsSection');
            const statsContent = document.getElementById('statsContent');

            const totalDecisions = Object.values(decisionStats).reduce((sum, count) => sum + count, 0);

            if (totalDecisions >= 5) {
                statsSection.style.display = 'block';

                const categoryColors = {
                    '行动派': 'bg-blue-100 text-blue-800',
                    '直觉型': 'bg-purple-100 text-purple-800',
                    '智慧型': 'bg-green-100 text-green-800',
                    '冒险家': 'bg-orange-100 text-orange-800',
                    '励志型': 'bg-pink-100 text-pink-800',
                    '耐心型': 'bg-gray-100 text-gray-800',
                    '探索者': 'bg-teal-100 text-teal-800',
                    '准备型': 'bg-indigo-100 text-indigo-800',
                    '休息型': 'bg-yellow-100 text-yellow-800',
                    '享乐型': 'bg-red-100 text-red-800',
                    '挑战者': 'bg-emerald-100 text-emerald-800',
                    '哲思型': 'bg-cyan-100 text-cyan-800'
                };

                statsContent.innerHTML = Object.entries(decisionStats)
                    .sort(([,a], [,b]) => b - a)
                    .slice(0, 6)
                    .map(([category, count]) => {
                        const percentage = ((count / totalDecisions) * 100).toFixed(1);
                        const colorClass = categoryColors[category] || 'bg-gray-100 text-gray-800';
                        return `
                            <div class="flex items-center justify-between">
                                <span class="px-2 py-1 rounded-full text-xs ${colorClass}">${category}</span>
                                <span class="text-gray-600">${count} (${percentage}%)</span>
                            </div>
                        `;
                    }).join('');
            }
        }

        function shareResult() {
            const resultText = document.getElementById('resultText').textContent;
            const resultIcon = document.getElementById('resultIcon').textContent;

            const shareText = `🧙‍♂️ 命运告诉我：${resultIcon} ${resultText}\n\n来自「做事行动器」- 让命运决定你的选择！`;

            if (navigator.share) {
                navigator.share({
                    title: '做事行动器',
                    text: shareText,
                    url: window.location.href
                }).catch(console.error);
            } else {
                // 复制到剪贴板
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('✅ 结果已复制到剪贴板！');
                }).catch(() => {
                    // 备用方案：显示分享文本供用户手动复制
                    showShareDialog(shareText);
                });
            }

            playSound('share');
        }

        function clearHistory() {
            if (confirm('确定要清空所有决策历史吗？')) {
                decisionHistory = [];
                localStorage.removeItem('decisionHistory');
                updateHistoryDisplay();
                showToast('🗑️ 历史记录已清空');
                playSound('clear');
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50 fade-in';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }

        function showShareDialog(text) {
            const dialog = document.createElement('div');
            dialog.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            dialog.innerHTML = `
                <div class="bg-white rounded-lg p-6 m-4 max-w-sm w-full">
                    <h3 class="text-lg font-semibold mb-4">分享结果</h3>
                    <textarea class="w-full h-24 p-2 border rounded resize-none text-sm" readonly>${text}</textarea>
                    <div class="flex gap-2 mt-4">
                        <button class="flex-1 bg-blue-500 text-white py-2 px-4 rounded" onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}')">复制</button>
                        <button class="flex-1 bg-gray-300 text-gray-700 py-2 px-4 rounded" onclick="document.body.removeChild(this.parentElement.parentElement.parentElement)">关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);
        }

        function playSound(type) {
            // 简化的音效实现（在现代浏览器中可能受限）
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                switch(type) {
                    case 'click':
                        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                    case 'share':
                        oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.2);
                        break;
                    case 'clear':
                        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                    case 'easter':
                        oscillator.frequency.setValueAtTime(523, audioContext.currentTime); // C5
                        oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1); // E5
                        oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2); // G5
                        gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
                        gainNode.gain.setValueAtTime(0.04, audioContext.currentTime + 0.3);
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                }
            } catch (e) {
                // 静默处理音效失败
            }
        }

        // 北京时间显示功能
        function updateBeijingTime() {
            const now = new Date();
            // 获取北京时间 (UTC+8)
            const beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));

            const hours = beijingTime.getHours().toString().padStart(2, '0');
            const minutes = beijingTime.getMinutes().toString().padStart(2, '0');
            const seconds = beijingTime.getSeconds().toString().padStart(2, '0');

            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById('beijingTime').textContent = timeString;
        }

        // 初始化时间显示并每秒更新
        updateBeijingTime();
        setInterval(updateBeijingTime, 1000);

        // 初始化隐藏结果容器和按钮
        document.getElementById('resultContainer').classList.remove('show');
        document.getElementById('shareButton').style.display = 'none';
        document.getElementById('categoryBadge').style.display = 'none';

        // 彩蛋功能
        function checkEasterEgg() {
            easterEggClicks++;

            if (easterEggClicks === 1) {
                easterEggTimer = setTimeout(() => {
                    easterEggClicks = 0;
                }, 2000);
            } else if (easterEggClicks >= 7) {
                triggerEasterEgg();
                easterEggClicks = 0;
                if (easterEggTimer) {
                    clearTimeout(easterEggTimer);
                }
            }
        }

        function triggerEasterEgg() {
            const titleText = document.getElementById('titleText');
            const originalText = titleText.textContent;

            // 显示彩蛋消息
            const easterEgg = document.createElement('div');
            easterEgg.className = 'easter-egg';
            easterEgg.textContent = '🎉 你发现了一个彩蛋！🎉';
            document.body.appendChild(easterEgg);

            // 播放音效
            playSound('easter');

            // 标题变色动画
            titleText.style.background = 'linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57)';
            titleText.style.backgroundSize = '400% 400%';
            titleText.style.animation = 'rainbow 2s ease infinite';
            titleText.style.webkitBackgroundClip = 'text';
            titleText.style.backgroundClip = 'text';
            titleText.style.webkitTextFillColor = 'transparent';

            // 3秒后恢复原状
            setTimeout(() => {
                document.body.removeChild(easterEgg);
                titleText.style.background = '';
                titleText.style.backgroundSize = '';
                titleText.style.animation = '';
                titleText.style.webkitBackgroundClip = '';
                titleText.style.backgroundClip = '';
                titleText.style.webkitTextFillColor = '';
            }, 3000);

            showToast('🌈 彩蛋已激活！');
        }

        // 页面加载完成后更新历史和统计显示
        window.addEventListener('load', () => {
            updateHistoryDisplay();
            updateStatsDisplay();
        });
    </script>
</body>
</html>
